<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Field Kit">
  <!--
    The Field Kit mark: a first-aid cross broken into four modular tiles around a single point.
    The modules are the kit, the point is the location, and the red dot is the one red in the
    identity — the emergency at the centre of everything, mirroring the rule in the app.

    This file is the single source for the mark. scripts/build-brand-assets.mjs rasterises the same
    geometry (MODULES and DOT) to the app icons, and assets/expo.icon uses this SVG as its layer.
    If the geometry changes, change it in both — the numbers are small and deliberate.
  -->
  <defs>
    <linearGradient id="fieldkit-module" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A6BFF"/>
      <stop offset="1" stop-color="#6D4BFF"/>
    </linearGradient>
  </defs>
  <g fill="url(#fieldkit-module)">
    <rect x="31" y="1" width="34" height="34" rx="12"/>
    <rect x="1" y="31" width="34" height="34" rx="12"/>
    <rect x="61" y="31" width="34" height="34" rx="12"/>
    <rect x="31" y="61" width="34" height="34" rx="12"/>
  </g>
  <circle cx="48" cy="48" r="9" fill="#E51D38"/>
</svg>
