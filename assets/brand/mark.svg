<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Field Kit">
  <!--
    The Contour mark: the first-aid cross drawn as three nested contour rings around a single red
    point — the OS map's own line language, and the app's subject, rather than an imported
    illustration. The red point is the one red in the identity, mirroring the rule in the app.

    Each ring is a plus outline with half-arm-length `a` and half-arm-width `b`, centred at (48,48):
      (a,b) = (46,18) at 45% · (33,11) at 75% · (20,4) at 100%, stroke 3.5, red point r 5.5.

    This file is the single source for the mark. scripts/build-brand-assets.mjs rasterises the same
    geometry (PLUS_RINGS and DOT) to the app icons. If the geometry changes, change it in both —
    the numbers are small and deliberate.
  -->
  <g fill="none" stroke="#D7F94A" stroke-width="3.5" stroke-linejoin="round">
    <path d="M30 2 H66 V30 H94 V66 H66 V94 H30 V66 H2 V30 H30 Z" stroke-opacity="0.45"/>
    <path d="M37 15 H59 V37 H81 V59 H59 V81 H37 V59 H15 V37 H37 Z" stroke-opacity="0.75"/>
    <path d="M44 28 H52 V44 H68 V52 H52 V68 H44 V52 H28 V44 H44 Z"/>
  </g>
  <circle cx="48" cy="48" r="5.5" fill="#E5192B"/>
</svg>
