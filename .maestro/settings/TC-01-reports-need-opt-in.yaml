# TC-01 — a report cannot be sent without the opt-in, and never sends itself.
#
# Why this flow exists: the whole design of this feature is a policy decision. OpenStreetMap's API
# Usage Policy forbids a client submitting "on behalf of users", and their notes are "for humans to
# communicate with other humans". So the safety property worth testing on a device is not that sending
# works — it is that sending is *impossible* until a person turns it on and taps Send, and that
# flagging still works without any of it.
#
# Nothing is ever sent by this flow. Posting real notes as a side effect of a test would be vandalism,
# so the success path is covered by unit tests against an injected fetch instead; this flow can only
# prove the refusal.
#
# Prerequisite: defibrillators nearby, so there is something to flag. The flow sets its own position
# rather than relying on how the simulator was left.
#
# clearState, so the opt-in is off because it starts off rather than because a previous flow left it
# that way. Maestro does not order flows predictably — the filesystem decides, and in practice it runs
# TC-02 before TC-01 — so a flow that reads leftover state is a flow that fails at random.
appId: com.colouringcode.fieldkit
tags:
  - settings
---
- launchApp:
    clearState: true
    permissions:
      location: inuse
- setLocation:
    latitude: 51.5074
    longitude: -0.1278
- tapOn:
    id: act-aed
- assertVisible:
    id: aed-screen

# Flag an entry. This must work regardless of any reporting setting: the entry hides locally, and a
# report joins the queue.
#
# A swipe, not `scrollUntilVisible`. The dock above the tab bar made the pinned footer taller, so the
# first result's flag now sits just below the fold — but its frame still lands on the *screen*, so
# Maestro reports "visibility percentage 1.0", scrolls zero times, and then taps coordinates that are
# underneath the footer, hitting "Show on a map" instead. See the README's sixth lesson.
#
# The distance is deliberately small and the duration long. Its job is only to lift the flag clear of
# the footer: a full-page swipe carries it under the navigation header instead, where the tap lands
# on nothing and the flag is never applied — which looks like a reporting bug and is not one.
- swipe:
    start: '50%, 58%'
    end: '50%, 44%'
    duration: 800
- tapOn:
    id: aed-flag-0

- tapOn:
    id: aed-settings
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 30000

# The opt-in exists, and is off in a fresh install.
- assertVisible:
    id: settings-osm-opt-in

# Scroll before asserting: the dock made the pinned footer taller, so the waiting report now sits
# below the fold, and `assertVisible` only counts what is on screen. See the README's sixth lesson.
- swipe:
    start: '50%, 70%'
    end: '50%, 26%'
    duration: 500

# The report is waiting — and there is no way to send it.
- assertVisible:
    id: settings-waiting
- assertNotVisible:
    id: settings-note-send-0
- assertNotVisible:
    id: settings-note-0

- takeScreenshot: /tmp/fieldkit-settings
