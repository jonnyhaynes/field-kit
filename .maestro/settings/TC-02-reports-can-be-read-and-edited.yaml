# TC-02 — with the opt-in on, the report can be read and edited before it is sent.
#
# The counterpart to TC-01. Together they cover the two states of the policy: no way to send until a
# person asks for it, and a report they can actually read and change once they have.
#
# **This flow never taps Send.** A test that posted real notes to OpenStreetMap would be vandalism, so
# the send path is covered by unit tests against an injected fetch, and this stops one step short.
# It turns the opt-in back off at the end, so the device is left as it was found and TC-01 still holds.
#
# It flags its own entry rather than relying on TC-01 having left one: Maestro does not order flows
# predictably — the filesystem decides, and it runs this one first — so a dependency on the other
# flow's leftovers is a flow that fails on a clean device. clearState makes the opt-in's starting
# position a fact rather than an assumption.
#
# Prerequisite: defibrillators nearby, so there is something to flag. The flow sets its own position
# rather than relying on how the simulator was left.
appId: com.colouringcode.fieldkit
tags:
  - settings
---
- launchApp:
    clearState: true
    permissions:
      location: inuse
- setLocation:
    latitude: 51.5074
    longitude: -0.1278
- tapOn:
    id: act-aed

# Flag an entry, so there is something waiting to read.
#
# Swiped rather than scrolled to, for the reason in TC-01: the element reports as fully visible while
# actually sitting under the taller pinned footer. See the README's sixth lesson.
- swipe:
    start: '50%, 55%'
    end: '50%, 18%'
    duration: 500
- tapOn:
    id: aed-flag-0

- tapOn:
    id: aed-settings
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 30000

# Opt in. This shows the reports; it sends nothing.
- tapOn:
    id: settings-osm-opt-in

# Swipe before waiting. The dock made the pinned footer taller, so the report is below the fold now
# and `extendedWaitUntil visible` would never become true however long it waited.
- swipe:
    start: '50%, 70%'
    end: '50%, 26%'
    duration: 500
- extendedWaitUntil:
    visible:
      id: settings-note-0
    timeout: 10000

# The text is editable and the send control is now here. It is the user's report, not a template they
# cannot change.
#
# The controls sit below the note's text, and the Responder tools card above this section pushes them
# past the fold — so scroll to them. `assertVisible` only counts what is on screen, and the whole
# screen lives in one ScrollView.
- assertVisible:
    id: settings-note-text-0
- scrollUntilVisible:
    element:
      id: settings-note-send-0
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: settings-note-discard-0

- takeScreenshot: /tmp/fieldkit-settings-optin

# Put it back, so this flow leaves no trace and TC-01 keeps passing on a re-run. The switch is above
# the fold now, so scroll back to it.
- scrollUntilVisible:
    element:
      id: settings-osm-opt-in
    direction: UP
    timeout: 30000
- tapOn:
    id: settings-osm-opt-in
- assertNotVisible:
    id: settings-note-send-0
