# TC-02 — turning the Responder depth on opens the gate, and the choice survives a relaunch.
#
# Why this flow exists: the depth is stored, so "on" has to mean on after the app is restarted, not
# merely for the life of one screen. A setting held only in React state would pass every unit test in
# this repo and lose the user's choice the moment the phone locked.
#
# clearState wipes the sandbox so the switch starts from a known position rather than from whatever
# the last run left. Every capture flow does this, so they are order-independent and re-runnable.
#
# The flow grants its own location permission and sets its own position, because clearState resets the
# grants and the capture screen asks for a position once a report is open.
appId: com.colouringcode.fieldkit
tags:
  - capture
---
- launchApp:
    clearState: true
    permissions:
      location: inuse
- setLocation:
    latitude: 51.5074
    longitude: -0.1278

# Settings live behind the More tab, not the emergency path — the AED screen no longer carries a
# settings link (the board's AED screen has none), so More is how a person gets there.
- tapOn:
    id: tab-more
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 30000

- tapOn:
    id: settings-depth-switch

# Relaunch before looking: the switch must have written, not just re-rendered.
- launchApp
- extendedWaitUntil:
    visible:
      id: act-record
    timeout: 30000
- tapOn:
    id: act-record
- extendedWaitUntil:
    visible:
      id: record-screen
    timeout: 30000

# With the depth on, the refusal is gone and a report can be started.
- assertNotVisible:
    id: record-refused
- assertVisible:
    id: record-start

- tapOn:
    id: record-start

# All four mnemonics appear in the index, each with what it is for. ETHANE and ASHICE describe
# different things — a scene and a casualty — so a form that lost that distinction would be a clinical
# error, not a cosmetic one.
#
# The index is four rows, which can still run past the fold on a small screen, so the search scrolls
# to each mnemonic rather than assuming it is on screen.
- extendedWaitUntil:
    visible:
      id: record-mnemonic-sampler
    timeout: 10000
- scrollUntilVisible:
    element:
      id: record-mnemonic-abcde
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: record-mnemonic-ethane
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: record-mnemonic-ashice
    direction: DOWN
    timeout: 30000

- takeScreenshot: /tmp/fieldkit-record
