# TC-03 — what was recorded is still there after a relaunch, and the gate closes again.
#
# Why this flow exists: a report is the one thing on this device worth keeping, and §4 says reports
# are the user's own health data, kept in the sandbox. Losing an observation to a restart during an
# incident is the failure that matters. This records two answers, restarts the app, and checks they
# came back — then turns the depth off and checks the gate shuts.
#
# Self-contained on purpose: it turns the depth on itself rather than relying on TC-02 having run, so
# a single flow can be run on its own and the suite does not depend on Maestro's chosen order.
#
# The flow grants its own location permission and sets its own position, because clearState resets the
# grants and the capture screen asks for a position once a report is open.
appId: com.colouringcode.fieldkit
tags:
  - capture
---
- launchApp:
    clearState: true
    permissions:
      location: inuse
- setLocation:
    latitude: 51.5074
    longitude: -0.1278

# Setup: turn the Responder depth on. The switch is TC-02's subject; here it is a precondition.
- tapOn:
    id: act-aed
- extendedWaitUntil:
    visible:
      id: aed-settings
    timeout: 60000
- tapOn:
    id: aed-settings
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 30000
- tapOn:
    id: settings-depth-switch

- launchApp
- extendedWaitUntil:
    visible:
      id: act-record
    timeout: 30000
- tapOn:
    id: act-record
- extendedWaitUntil:
    visible:
      id: record-start
    timeout: 30000
- tapOn:
    id: record-start

# A choice and a number. ACVPU rather than GCS, because a first aider has no training for the latter.
- scrollUntilVisible:
    element:
      id: record-choice-abcde.consciousness-0
    direction: DOWN
    timeout: 30000
- tapOn:
    id: record-choice-abcde.consciousness-0

# Breathing rate sits above consciousness in ABCDE, so this scrolls back up.
- scrollUntilVisible:
    element:
      id: record-input-abcde.breathingRate
    direction: UP
    timeout: 30000
- tapOn:
    id: record-input-abcde.breathingRate
- inputText: '16'
- takeScreenshot: /tmp/fieldkit-record-filled

# Relaunch, then come back through the action — not a deep link, so this also proves the route is
# still reachable the way a user reaches it.
- launchApp
- extendedWaitUntil:
    visible:
      id: act-record
    timeout: 30000
- tapOn:
    id: act-record
- extendedWaitUntil:
    visible:
      id: record-mnemonic-sampler
    timeout: 30000

# The number came back.
- scrollUntilVisible:
    element:
      id: record-input-abcde.breathingRate
    direction: DOWN
    timeout: 30000
- assertVisible:
    text: '16'

# And the chip came back selected: the answer was written, not held in memory.
- scrollUntilVisible:
    element:
      id: record-choice-abcde.consciousness-0
      selected: true
    direction: DOWN
    timeout: 30000

# Turning the depth off closes the gate, so this is not a one-way door.
#
# Back to the Act screen first: this flow is standing on /field, and the settings link lives on the
# AED screen behind it.
- launchApp
- extendedWaitUntil:
    visible:
      id: act-aed
    timeout: 30000
- tapOn:
    id: act-aed
- extendedWaitUntil:
    visible:
      id: aed-settings
    timeout: 60000
- tapOn:
    id: aed-settings
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 30000
- tapOn:
    id: settings-depth-switch

- launchApp
- extendedWaitUntil:
    visible:
      id: act-screen
    timeout: 30000
- assertNotVisible:
    id: act-record
