# TC-03 — what was recorded is still there after a relaunch, and the gate closes again.
#
# Why this flow exists: a report is the one thing on this device worth keeping, and §4 says reports
# are the user's own health data, kept in the sandbox. Losing an observation to a restart during an
# incident is the failure that matters. This records two answers, restarts the app, and checks they
# came back — then turns the depth off and checks the gate shuts.
#
# Self-contained on purpose: it turns the depth on itself rather than relying on TC-02 having run, so
# a single flow can be run on its own and the suite does not depend on Maestro's chosen order.
#
# The flow grants its own location permission and sets its own position, because clearState resets the
# grants and the capture screen asks for a position once a report is open.
#
# The capture form is a **focused route** now, not four forms in one scroll: the index opens ABCDE,
# and the form is worked through its named steps, which the step bar switches between.
appId: com.colouringcode.fieldkit
tags:
  - capture
---
- launchApp:
    clearState: true
    permissions:
      location: inuse
- setLocation:
    latitude: 51.5074
    longitude: -0.1278

# Setup: turn the Responder depth on. The switch is TC-02's subject; here it is a precondition.
- tapOn:
    id: act-aed
- extendedWaitUntil:
    visible:
      id: aed-settings
    timeout: 60000
- tapOn:
    id: aed-settings
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 30000
- tapOn:
    id: settings-depth-switch

- launchApp
- extendedWaitUntil:
    visible:
      id: act-record
    timeout: 30000
- tapOn:
    id: act-record
- extendedWaitUntil:
    visible:
      id: record-start
    timeout: 30000
- tapOn:
    id: record-start

# Open ABCDE from the index. The form gets the screen, and its steps are the mnemonic's own letters.
- extendedWaitUntil:
    visible:
      id: record-form-abcde
    timeout: 30000
- tapOn:
    id: record-form-abcde
- extendedWaitUntil:
    visible:
      id: capture-stepbar
    timeout: 30000

# Step D is Disability (index 3). A choice: ACVPU rather than GCS, because a first aider has no
# training for the latter.
- tapOn:
    id: capture-step-3
- tapOn:
    id: record-choice-abcde.consciousness-0

# Step B is Breathing (index 1), and holds the breathing rate.
- tapOn:
    id: capture-step-1
- tapOn:
    id: record-input-abcde.breathingRate
- inputText: '16'
- takeScreenshot: /tmp/fieldkit-record-filled

# Relaunch, then come back through the action — not a deep link, so this also proves the route is
# still reachable the way a user reaches it.
- launchApp
- extendedWaitUntil:
    visible:
      id: act-record
    timeout: 30000
- tapOn:
    id: act-record
- extendedWaitUntil:
    visible:
      id: record-form-abcde
    timeout: 30000
- tapOn:
    id: record-form-abcde
- extendedWaitUntil:
    visible:
      id: capture-stepbar
    timeout: 30000

# The number came back.
- tapOn:
    id: capture-step-1
- assertVisible:
    text: '16'

# And the chip came back selected: the answer was written, not held in memory.
- tapOn:
    id: capture-step-3
- assertVisible:
    id: record-choice-abcde.consciousness-0
    selected: true

# Turning the depth off closes the gate, so this is not a one-way door.
#
# Back to the Act screen first: this flow is standing on /field, and the settings link lives on the
# AED screen behind it.
- launchApp
- extendedWaitUntil:
    visible:
      id: act-aed
    timeout: 30000
- tapOn:
    id: act-aed
- extendedWaitUntil:
    visible:
      id: aed-settings
    timeout: 60000
- tapOn:
    id: aed-settings
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 30000
- tapOn:
    id: settings-depth-switch

- launchApp
- extendedWaitUntil:
    visible:
      id: act-screen
    timeout: 30000
- assertNotVisible:
    id: act-record
