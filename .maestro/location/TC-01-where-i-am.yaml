# TC-01 — "Where I am" reads out a grid reference for the current position.
#
# Why this flow exists: the conversion is pure and unit-tested against OS's own worked examples,
# but the screen around it is not, and the last phase taught the same lesson — a green test suite
# said nothing about whether the thing actually appeared on a device.
#
# The flow sets its own position, inside Great Britain.
appId: com.colouringcode.fieldkit
tags:
  - location
---
- launchApp:
    permissions:
      location: inuse
- setLocation:
    latitude: 51.5074
    longitude: -0.1278

# Act -> AED -> map -> Where I am.
- tapOn:
    id: act-aed
- assertVisible:
    id: aed-screen
- tapOn:
    id: aed-map
# The start point matters: it must be in the ScrollView's text area *below the map*, because a swipe
# that begins over the MapLibre view pans the map instead of scrolling the page. The dock made the
# footer taller, so the link rows are below the fold and no longer reachable without a scroll.
- swipe:
    start: '50%, 76%'
    end: '50%, 28%'
    duration: 500
- tapOn:
    id: map-position-link

- assertVisible:
    id: position-screen

- extendedWaitUntil:
    visible:
      id: position-grid-ref
    timeout: 30000

# In coverage, so the refusal must not be what is shown.
- assertNotVisible:
    id: position-out-of-coverage

# The what3words field is present, and has not resolved anything: resolving is an explicit action,
# never something fired by opening a screen. With no API key configured this build shows its
# "not available" state, which is what the honest default looks like.
- assertVisible:
    id: position-w3w
- assertNotVisible:
    id: position-w3w-words

- takeScreenshot: /tmp/fieldkit-position
