<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Field Kit" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    The Contour mark (proposal, docs/plans/field-kit-contour.md §4 slice 2): the first-aid cross drawn
    as three nested contour rings around one red point. The red point is the one red in the identity.
    On pine #0F1A16 as drawn; on light grounds the rings go to ink #10201A.
  -->
  <g fill="none" stroke="#D7F94A" stroke-width="3.5" stroke-linejoin="round">
    <path d="M30 2 H66 V30 H94 V66 H66 V94 H30 V66 H2 V30 H30 Z" stroke-opacity="0.45"/>
    <path d="M37 15 H59 V37 H81 V59 H59 V81 H37 V59 H15 V37 H37 Z" stroke-opacity="0.75"/>
    <path d="M44 28 H52 V44 H68 V52 H52 V68 H44 V52 H28 V44 H44 Z"/>
  </g>
  <circle cx="48" cy="48" r="5.5" fill="#E5192B"/>
</svg>
